<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Expense approval automation</title>
  <desc id="d">An employee submits an expense, the system captures its data, checks it against the approval rule and approves it automatically.</desc>

  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ink { fill: #101418; } .mut { fill: #4A5261; } .soft { fill: #8A919C; }
      .card { fill: #FFFFFF; stroke: #E4E6EA; stroke-width: 2; }
      .wire { stroke: #C4C9D0; stroke-width: 2; }
      .dash { stroke: #0B5CFF; stroke-width: 2.5; stroke-dasharray: 2 9; stroke-linecap: round; }

      /* motion: flowing dotted connectors, progress bar, scan beam, path highlight */
      .flow { animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -22; } }
      .progress { transform-box: fill-box; transform-origin: left; animation: fill 6s ease-in-out infinite; }
      @keyframes fill { 0% { transform: scaleX(0); } 25%, 100% { transform: scaleX(1); } }
      .beam { animation: scan 6s ease-in-out infinite; }
      @keyframes scan { 0%, 30% { transform: translateY(0); opacity: 0; } 35% { opacity: .5; } 60% { transform: translateY(230px); opacity: .5; } 65%, 100% { transform: translateY(230px); opacity: 0; } }
      .tick { transform-box: fill-box; transform-origin: center; animation: pop 6s ease-out infinite; }
      @keyframes pop { 0%, 40% { transform: scale(0); } 48% { transform: scale(1.15); } 54%, 100% { transform: scale(1); } }
      .t2 { animation-delay: .25s; } .t3 { animation-delay: .5s; } .t4 { animation-delay: .75s; }
      .route { stroke-dasharray: 520; animation: route 6s ease-in-out infinite; }
      @keyframes route { 0%, 55% { stroke-dashoffset: 520; } 75%, 100% { stroke-dashoffset: 0; } }
      .glow { animation: glow 6s ease-in-out infinite; }
      @keyframes glow { 0%, 72% { opacity: 0; } 80%, 100% { opacity: 1; } }
      .dim { animation: dim 6s ease-in-out infinite; }
      @keyframes dim { 0%, 55% { opacity: 1; } 70%, 100% { opacity: .42; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .progress, .beam, .tick, .route, .glow, .dim { animation: none; }
        .beam { opacity: 0; }
      }
    </style>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#D5D8DD"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="1000" fill="url(#fade)"/></mask>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#101418" flood-opacity=".08"/>
    </filter>
    <filter id="blueGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0B5CFF" flood-opacity=".28"/>
    </filter>
    <clipPath id="captureClip"><rect x="660" y="160" width="500" height="320" rx="22"/></clipPath>
  </defs>

  <!-- dotted canvas -->
  <rect width="1200" height="1000" fill="url(#dots)" mask="url(#gridMask)"/>

  <!-- ============ connectors (drawn first so cards sit on top) ============ -->
  <!-- 01 → 02 -->
  <path id="p1" d="M540 250 C 600 250, 600 300, 660 300" class="dash flow"/>
  <!-- 02 → 03 -->
  <path id="p2" d="M910 480 C 910 530, 760 520, 700 556" class="dash flow"/>
  <circle r="6" fill="#0B5CFF">
    <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
  </circle>
  <circle r="6" fill="#0B5CFF">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
  </circle>

  <!-- ============ 01 · SUBMISSION ============ -->
  <g>
    <text x="40" y="44" class="mono" font-size="15" font-weight="500" fill="#0B5CFF" letter-spacing="1">01 · SUBMISSION</text>
    <rect x="40" y="64" width="500" height="372" rx="22" class="card" filter="url(#lift)"/>
    <!-- header -->
    <circle cx="74" cy="104" r="8" fill="#15935A"/>
    <text x="92" y="110" font-size="17" font-weight="600" class="ink">Expenses</text>
    <rect x="410" y="90" width="104" height="28" rx="8" fill="#E6EEFF"/>
    <text x="462" y="109" font-size="14" font-weight="600" fill="#0B5CFF" text-anchor="middle">New claim</text>
    <line x1="64" y1="134" x2="516" y2="134" stroke="#E4E6EA" stroke-width="2"/>
    <text x="64" y="176" font-size="26" font-weight="600" class="ink">Submit an expense</text>
    <!-- file -->
    <rect x="64" y="196" width="452" height="84" rx="14" fill="#F6F8FC" stroke="#CBD5E6" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="82" y="214" width="36" height="42" rx="6" fill="#FDE8E8"/>
    <path d="M91 222h12l7 7v19H91z" fill="#D64545"/>
    <path d="M103 222v7h7" fill="#F3A3A3"/>
    <text x="132" y="232" font-size="17" font-weight="600" class="ink">travel-claim-sep.pdf</text>
    <text x="132" y="254" font-size="14" class="soft">214 KB · Uploaded</text>
    <circle cx="492" cy="236" r="12" fill="#15935A"/>
    <path d="M486 236.5l4 4 8-8.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="82" y="264" width="416" height="6" rx="3" fill="#E6EEFF"/>
    <rect x="82" y="264" width="416" height="6" rx="3" fill="#0B5CFF" class="progress"/>
    <!-- fields -->
    <rect x="64" y="298" width="220" height="62" rx="12" class="card"/>
    <text x="82" y="322" font-size="13" class="soft">Category</text>
    <text x="82" y="346" font-size="19" font-weight="600" class="ink">Travel</text>
    <rect x="296" y="298" width="220" height="62" rx="12" class="card"/>
    <text x="314" y="322" font-size="13" class="soft">Amount</text>
    <text x="314" y="346" font-size="19" font-weight="600" class="ink">₹18,400</text>
    <!-- button -->
    <rect x="64" y="376" width="452" height="44" rx="12" fill="#0B5CFF"/>
    <text x="290" y="404" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Submit for approval</text>
    <!-- cursor -->
    <path d="M448 398v27l7.5-7 5 11.3 5-2.2-5-11 10-.6z" fill="#101418" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- ============ 02 · DATA CAPTURE ============ -->
  <g>
    <text x="660" y="140" class="mono" font-size="15" font-weight="500" fill="#0B5CFF" letter-spacing="1">02 · DATA CAPTURE</text>
    <rect x="660" y="160" width="500" height="320" rx="22" class="card" filter="url(#lift)"/>
    <rect x="684" y="182" width="38" height="38" rx="10" fill="#E6EEFF"/>
    <path d="M694 196v-4a2 2 0 0 1 2-2h4M708 190h4a2 2 0 0 1 2 2v4M714 206v4a2 2 0 0 1-2 2h-4M700 212h-4a2 2 0 0 1-2-2v-4M694 201h20" stroke="#0B5CFF" stroke-width="2" stroke-linecap="round"/>
    <text x="736" y="199" font-size="18" font-weight="600" class="ink">Data capture</text>
    <text x="736" y="217" font-size="13" class="soft">travel-claim-sep.pdf</text>
    <rect x="1040" y="187" width="96" height="28" rx="8" fill="#E3F4EA"/>
    <text x="1088" y="206" font-size="13" font-weight="600" fill="#15935A" text-anchor="middle">Extracted</text>

    <g font-size="15">
      <rect x="684" y="238" width="452" height="42" rx="10" fill="#F5F7FA"/>
      <text x="702" y="264" class="mut">Employee</text>
      <text x="1094" y="264" class="mono ink" text-anchor="end">Riya Sharma</text>
      <g class="tick"><circle cx="1114" cy="259" r="9" fill="#15935A"/><path d="M1110 259.5l3 3 5.5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>

      <rect x="684" y="288" width="452" height="42" rx="10" fill="#F5F7FA"/>
      <text x="702" y="314" class="mut">Category</text>
      <text x="1094" y="314" class="mono ink" text-anchor="end">Travel</text>
      <g class="tick t2"><circle cx="1114" cy="309" r="9" fill="#15935A"/><path d="M1110 309.5l3 3 5.5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>

      <rect x="684" y="338" width="452" height="42" rx="10" fill="#F5F7FA"/>
      <text x="702" y="364" class="mut">Amount</text>
      <text x="1094" y="364" class="mono ink" text-anchor="end">₹18,400.00</text>
      <g class="tick t3"><circle cx="1114" cy="359" r="9" fill="#15935A"/><path d="M1110 359.5l3 3 5.5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>

      <rect x="684" y="388" width="452" height="42" rx="10" fill="#F5F7FA"/>
      <text x="702" y="414" class="mut">Date</text>
      <text x="1094" y="414" class="mono ink" text-anchor="end">22 Sep 2026</text>
      <g class="tick t4"><circle cx="1114" cy="409" r="9" fill="#15935A"/><path d="M1110 409.5l3 3 5.5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>

    <!-- scan beam -->
    <g clip-path="url(#captureClip)">
      <rect x="672" y="232" width="476" height="4" rx="2" fill="#0B5CFF" class="beam"/>
    </g>

    <!-- db pill -->
    <g transform="translate(684 442)">
      <rect width="316" height="30" rx="15" fill="#101418"/>
      <ellipse cx="22" cy="10" rx="7" ry="3" fill="#fff"/>
      <path d="M15 10v10c0 1.7 3.1 3 7 3s7-1.3 7-3V10M15 15c0 1.7 3.1 3 7 3s7-1.3 7-3" stroke="#fff" stroke-width="1.8"/>
      <text x="40" y="20" font-size="13" class="mono" fill="#fff">INSERT INTO expenses</text>
      <rect x="216" y="5" width="92" height="20" rx="10" fill="#15935A"/>
      <text x="262" y="19.5" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">1 row saved</text>
    </g>
  </g>

  <!-- ============ 03 · VALIDATION & DECISION ============ -->
  <g>
    <text x="40" y="540" class="mono" font-size="15" font-weight="500" fill="#0B5CFF" letter-spacing="1">03 · VALIDATION &amp; DECISION</text>

    <!-- wires -->
    <path d="M600 656v36" class="wire"/>
    <path d="M600 732v26H330v34M600 758h270v34" class="wire"/>
    <path d="M600 732v26H330v34" stroke="#0B5CFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="route"/>
    <path d="M820 606h46" class="wire"/>

    <!-- rule node -->
    <rect x="380" y="556" width="440" height="100" rx="16" class="card" filter="url(#lift)"/>
    <rect x="404" y="578" width="12" height="12" rx="3" fill="#7C5CFF"/>
    <text x="424" y="589" font-size="13" class="mut">Approval rules</text>
    <text x="796" y="589" font-size="12" class="mono soft" text-anchor="end">03 · Validate</text>
    <text x="404" y="621" font-size="19" font-weight="600" class="ink">Check amount against policy</text>
    <text x="404" y="643" font-size="14" class="mut">Travel limit ≤ ₹25,000</text>

    <!-- pass pill -->
    <rect x="866" y="584" width="294" height="44" rx="12" class="card" filter="url(#lift)"/>
    <circle cx="890" cy="606" r="10" fill="#15935A"/>
    <path d="M885.5 606.5l3.2 3.2 6-6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="908" y="611" font-size="14" class="mono ink">₹18,400 ≤ ₹25,000</text>
    <rect x="1086" y="595" width="60" height="22" rx="7" fill="#E3F4EA"/>
    <text x="1116" y="610.5" font-size="12" font-weight="600" fill="#15935A" text-anchor="middle">Pass</text>

    <!-- decision chip -->
    <rect x="530" y="692" width="140" height="40" rx="10" class="card" filter="url(#lift)"/>
    <path d="M560 702v7M560 709l-7 8M560 709l7 8" stroke="#C27A0A" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="553" cy="720" r="2.6" fill="#C27A0A"/><circle cx="567" cy="720" r="2.6" fill="#C27A0A"/>
    <text x="578" y="718" font-size="16" font-weight="600" class="ink">Decision</text>

    <!-- auto-approve (chosen) -->
    <rect x="130" y="792" width="400" height="104" rx="16" class="card" filter="url(#lift)"/>
    <rect x="130" y="792" width="400" height="104" rx="16" stroke="#0B5CFF" stroke-width="3" filter="url(#blueGlow)" class="glow"/>
    <rect x="154" y="814" width="12" height="12" rx="3" fill="#15935A"/>
    <text x="174" y="825" font-size="13" class="mut">Auto-approve</text>
    <rect x="404" y="808" width="104" height="24" rx="7" fill="#E3F4EA"/>
    <text x="456" y="824.5" font-size="12" font-weight="600" fill="#15935A" text-anchor="middle">Within limit</text>
    <text x="154" y="859" font-size="19" font-weight="600" class="ink">Approve instantly</text>
    <text x="154" y="881" font-size="14" class="mut">No manual step needed</text>

    <!-- manager review (not taken) -->
    <g class="dim">
      <rect x="670" y="792" width="400" height="104" rx="16" class="card" filter="url(#lift)"/>
      <rect x="694" y="814" width="12" height="12" rx="3" fill="#C27A0A"/>
      <text x="714" y="825" font-size="13" class="mut">Manager review</text>
      <rect x="954" y="808" width="94" height="24" rx="7" fill="#FBF0DC"/>
      <text x="1001" y="824.5" font-size="12" font-weight="600" fill="#C27A0A" text-anchor="middle">Over limit</text>
      <text x="694" y="859" font-size="19" font-weight="600" class="ink">Forward to manager</text>
      <text x="694" y="881" font-size="14" class="mut">Routes to the reporting manager</text>
    </g>

    <!-- approved pill -->
    <g class="glow">
      <rect x="200" y="918" width="260" height="44" rx="22" fill="#15935A" filter="url(#lift)"/>
      <circle cx="228" cy="940" r="10" fill="#fff"/>
      <path d="M223.5 940.5l3.2 3.2 6-6.5" stroke="#15935A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="248" y="945.5" font-size="15" font-weight="600" fill="#fff">Approved automatically</text>
    </g>
  </g>
</svg>