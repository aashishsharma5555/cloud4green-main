apiVersion: v1
kind: Service
metadata:
  name: cloud4green
  namespace: cloud4green
  labels:
    app.kubernetes.io/name: cloud4green
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: cloud4green
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
