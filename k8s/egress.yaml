apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud4green-egress
  namespace: cloud4green
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloud4green
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
